name: Refit Greg-par

# Runs the Greg-par regression daily, patches src/logic/difficulty.js
# between its PAR_MODEL:START / PAR_MODEL:END markers, and pushes the
# change straight to main (GitHub Pages then redeploys automatically).
#
# THE ANCHOR IS THE PRECOMPUTE, not a wall-clock hour. This fires at 00:17
# UTC, 2h43m before precompute-daily-board's 03:00 UTC run, so a night's
# board is generated under the model and experiment target fit that same
# night. The old 13:13 UTC slot put the refit AFTER the precompute it
# should feed, leaving every board written against a model 13.8 hours old.
#
# Read what this does and does not buy. It does NOT close experiment-target
# drift: a board written on day D is still played on D+7, under a target
# rewritten seven times since, and that is inherent to a seven-day horizon.
# The fix for drift is that clients no longer re-derive the board at all
# (daily, 2026-08-07; weekly, the same arc). What the move buys is coherent
# ordering, and his original complaint, which was that the refit reliably
# had not run by the time he checked at 10am.
#
# Still 17 minutes past, never on the hour: GitHub queues top-of-hour crons
# behind everyone else's, and the old '0 14' slot fired 60-120 minutes late
# all week (measured 2026-07-30..08-01: 15:51, 16:01, 15:00 UTC). Off-peak
# minutes drift far less. 00:17 UTC also sits well clear of the Pages
# congestion window (~15:00-16:30 UTC) that the deploy watchdog exists for.
#
# ONE COST, stated rather than hidden. ET days roll at 04:00 UTC, so 00:17
# UTC lands about 3h43m before the end of the ET day in progress. Plays from
# roughly 8pm ET onward therefore miss that night's fit and land in the next
# one. Nothing is lost, every row still reaches a fit within a day, and the
# lag falls uniformly on late-evening play; it is a one-cycle delay on the
# tail of each day rather than a hole.
#
# MOVED AN HOUR EARLIER, 00:17 -> 23:17 UTC, on 2026-08-09, because the margin
# this schedule exists to buy had almost entirely gone to GitHub's queue.
# MEASURED over the two nights the 00:17 cron ran: it STARTED at 02:28 and
# 02:24 UTC, a consistent ~2h10m late. The refit takes ~5 minutes, so it was
# finishing about 25 minutes before the 03:00 precompute rather than the 2h43m
# ahead the move was made for — and another half hour of queue delay would put
# it AFTER the board it is meant to inform, silently. At 23:17 the same delay
# lands it around 01:30, roughly 90 minutes clear.
#
# Actions cron does not observe DST, so this fires ~7:17pm ET the PREVIOUS
# evening in summer and ~6:17pm ET in winter, plus drift. That moves the
# one-cycle lag described above from ~8pm ET to ~7pm ET: slightly more of each
# evening's play lands in the NEXT night's fit. Still uniform, still a delay
# rather than a hole. Change the cron if you move timezones, and keep it ahead
# of the precompute if you do.
on:
  schedule:
    - cron: '17 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  # Needed to dispatch the Pages deploy after the refit pushes: commits
  # made with GITHUB_TOKEN never fire push-triggered workflows (GitHub's
  # recursion guard), so without an explicit dispatch the new PAR_MODEL,
  # handicaps, and experiment target sit on main UNDEPLOYED until the
  # next human push. Verified live 2026-06-10: the 17:22 UTC refit
  # pushed and no deploy followed.
  actions: write

concurrency:
  group: refit-par-model
  cancel-in-progress: false

jobs:
  refit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # For the pool re-price below. The shipped app imports nothing from
      # node_modules, so there is no install step — this is just a runtime for
      # the ES modules the script reads the ladder through.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          # Bump the suffix whenever the package list OR the runner OS
          # changes — binary R packages built against one Ubuntu release
          # won't load on another (Apr 2026: ubuntu-latest moved Jammy ->
          # Noble and the cached jammy `rlang.so` started erroring with
          # `undefined symbol: SETLENGTH`). Including ubuntu-version in
          # the key forces a clean reinstall whenever the runner shifts.
          key: r-pkgs-${{ runner.os }}-noble-brms-v2
          restore-keys: r-pkgs-${{ runner.os }}-noble-

      - name: Install R packages
        shell: Rscript {0}
        run: |
          # Use the system-detected RSPM URL set by r-lib/actions/setup-r
          # so we get noble binaries on noble runners and jammy on jammy.
          # Hardcoding the path was the previous bug — when the runner
          # OS shifted, the install pulled jammy binaries onto a noble
          # system and dyn.load failed.
          rspm <- Sys.getenv("RSPM")
          if (nzchar(rspm)) options(repos = c(CRAN = rspm))
          pkgs <- c("jsonlite", "dplyr", "tidyr", "purrr", "stringr",
                    "brms", "posterior", "rstan", "StanHeaders")
          need <- setdiff(pkgs, rownames(installed.packages()))
          if (length(need)) install.packages(need)

      - name: Refit PAR_MODEL
        # brms compiles a fresh Stan model at runtime (~30-60s) on top of
        # the sampling time; budget ~3 min for the whole run.
        timeout-minutes: 10
        run: Rscript scripts/refit-par-model.R

      # THE POOL IS PRICED IN PAR-SECONDS, so a refit that moves an equation
      # leaves every challenge-ladder entry mislabelled — the ladder's band,
      # the endless admission floor and the validator's acceptance band all
      # match against a number measured at yesterday's model. Nothing caught
      # that: the validator is not in CI and takes minutes.
      #
      # This step costs SECONDS, not minutes, because it re-prices rather than
      # re-measures. Generating and certifying a spec is model-INDEPENDENT and
      # only its price is not, so scripts/data/pool-features.json carries the
      # feature vector of each entry's median draw and predictPar re-answers
      # instantly. Re-measuring instead would take ~20 minutes AND erode the
      # pool, because it drops entries to seed noise.
      #
      # It relabels in place and never re-selects, so level assignments move
      # only as far as prices genuinely moved. If an entry leaves the rulings
      # the script writes nothing and exits non-zero — that is a re-SEARCH,
      # which is a human's call, and the failed run is the alarm.
      #
      # continue-on-error, and checked at the END. A boundary violation means
      # the pool needs a re-SEARCH, which is a human's call — but the model
      # refit must not be held hostage to it. The fit also drives par, the
      # handicaps, the experiment target and the next night's board precompute,
      # and losing all of that because two ladder entries crossed a ceiling is
      # the wrong trade. So the model still commits, the pool is left honestly
      # stale at its old prices, and the run goes red with the remedy named.
      - name: Re-price the challenge pool against the new model
        id: reprice
        continue-on-error: true
        run: node scripts/reprice-challenge-pool.mjs

      # The Climb LIBRARY follows the same night, his re-bin design
      # (2026-08-11): every stored board re-prices from its stored features
      # (seconds, no solving), a board whose par left its level's window
      # moves to the level whose window now holds it, and a board no window
      # holds waits in reserve.json rather than being tossed. Only the
      # shortfall left after re-binning is generated, by the bounded fill
      # below. test/climbLibrary.test.mjs holds the lockstep: a refit that
      # lands without this step reddens CI with the remedy in the message.
      - name: Re-price and re-bin the Climb library
        id: libreprice
        continue-on-error: true
        run: node scripts/reprice-climb-library.mjs

      # Generation is bounded at 20 minutes a night: a quiet refit owes a
      # handful of boards and finishes in seconds; a model earthquake owes
      # more, pays 20 minutes now, and the manifest carries the remainder to
      # the next night. Deficits remaining after the budget are NOT a
      # failure — the deal is bounded nightly progress, never a stuck run.
      - name: Fill what the re-bin left short
        id: libfill
        if: steps.libreprice.outcome == 'success'
        continue-on-error: true
        run: node scripts/topup-climb-library.mjs --fill --minutes 20

      - name: Commit and push if anything changed
        id: commit
        run: |
          if git diff --quiet src/logic/difficulty.js src/logic/handicaps.json src/logic/experimentTarget.json src/logic/modelHistory.json src/logic/challengePool.js scripts/data/climb-library; then
            echo "No model, handicap, experiment-target, history, ladder-price, or library changes — nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "Christopher Wells"
          git config user.email "c.wells@bowdoin.edu"
          git add src/logic/difficulty.js src/logic/handicaps.json src/logic/experimentTarget.json src/logic/modelHistory.json src/logic/challengePool.js scripts/data/climb-library
          git commit -m "refit PAR_MODEL, handicaps, experiment target, and ladder prices — $(date -u +%Y-%m-%d)"
          # A plain push LOSES THE WHOLE NIGHT'S FIT if a human pushed to main
          # while Stan was sampling. That is not hypothetical: the 2026-08-03
          # refit fit cleanly (4 files, 315 insertions) and then died on
          # "! [rejected] main -> main (fetch first)" because a PR merged
          # mid-run, and the model simply did not update that day. The four
          # files this commit touches are refit-OWNED — nothing else writes
          # them — so rebasing onto whatever landed is always the right merge.
          pushed=false
          for attempt in 1 2 3 4 5; do
            if git push; then pushed=true; break; fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main and retrying"
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 5))
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::refit could not push after 5 attempts"
            exit 1
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy the refit (GITHUB_TOKEN pushes don't trigger push workflows)
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main

      - name: Fail the run if the pool could not be re-priced
        if: steps.reprice.outcome == 'failure'
        run: |
          echo "::error::The challenge pool left its rulings under the new model and was NOT re-priced."
          echo "The model, handicaps and experiment target committed normally; the ladder is stale."
          echo "Remedy: node scripts/search-endless-specs.mjs --absorb --seeds 10"
          echo "        node scripts/write-challenge-pool.mjs"
          echo "        node scripts/reprice-challenge-pool.mjs --capture"
          echo "        node scripts/validate-challenge250-specs.mjs"
          exit 1

      - name: Fail the run if the library could not be re-binned
        if: steps.libreprice.outcome == 'failure' || steps.libfill.outcome == 'failure'
        run: |
          echo "::error::The Climb library re-bin or fill crashed. The model committed normally;"
          echo "the library is stale under the old fingerprint and test/climbLibrary.test.mjs"
          echo "will name it on the next PR."
          echo "Remedy: node scripts/reprice-climb-library.mjs"
          echo "        node scripts/topup-climb-library.mjs --fill"
          exit 1

      - name: Notify on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -fsS -X POST -H "Content-Type: application/json" \
              -d "{\"content\":\":warning: GregSweeper workflow FAILED: ${{ github.workflow }} (run ${{ github.run_id }}, commit ${{ github.sha }})\"}" \
              "$DISCORD_WEBHOOK_URL" || true
          fi
