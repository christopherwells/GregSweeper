name: Report client errors

# Manual, READ-ONLY. Rolls up errors/{uid}/{ts} by label x codeVersion.
#
# That node is owner-read (`auth.uid === $uid`), so every error the app has
# captured is invisible to everything not holding the service account —
# including the app itself looking at anyone but you. The reporter has been
# writing faithfully for months with no way to read the result, which is why
# client-side divergence is still described in this repo as anecdotal.
#
# The label that motivated this is `daily-canonical-unavailable`, which fires
# with the code version attached whenever a client cannot reach the day's
# board. Grouped by version it separates three explanations that are otherwise
# indistinguishable: stale bundles on old code, slow or dropped reads on
# current code, or something unmodelled.
#
# The script issues GETs and nothing else. Its token is minted with DATABASE
# scope only (see scripts/service-account-auth.mjs), so it cannot reach the
# Auth records even by mistake, and it summarizes user agents to a platform
# rather than printing them.
#
# Deliberately NOT scheduled, for the reason the player-progress report is not:
# this answers a question when it is asked, and a cron would put captured
# stack traces into the run log every day for nobody to read.
#
#   gh workflow run report-client-errors.yml
#   gh workflow run report-client-errors.yml -f days=90
#   gh workflow run report-client-errors.yml -f label=daily-canonical-unavailable

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days back to include'
        default: '14'
      label:
        description: 'Only this label (e.g. daily-canonical-unavailable); blank for all'
        default: ''
      samples:
        description: 'Example messages to print per group'
        default: '2'

permissions:
  contents: read

jobs:
  report:
    runs-on: [self-hosted, gregsweeper-win]
    defaults:
      run:
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail "{0}"'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Inputs go through the environment rather than being interpolated into
      # the shell line — the house rule since the heatmap rollup.
      - name: Report
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DAYS: ${{ github.event.inputs.days }}
          LABEL: ${{ github.event.inputs.label }}
          SAMPLES: ${{ github.event.inputs.samples }}
        run: |
          FLAGS=""
          if [ -n "$LABEL" ]; then FLAGS="--label $LABEL"; fi
          node scripts/report-client-errors.mjs --days "${DAYS:-14}" --samples "${SAMPLES:-2}" $FLAGS
      - name: Report (JSON artifact)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DAYS: ${{ github.event.inputs.days }}
        run: node scripts/report-client-errors.mjs --json --days "${DAYS:-14}" > client-errors.json
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-errors
          path: client-errors.json
          if-no-files-found: ignore
